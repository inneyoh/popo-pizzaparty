else if(st=='pantry'&&fresh()&&down){if(tool=='rim'){if(dist>R()*.55){const i=((Math.round((Math.atan2(p.y-150,p.x-150)+Math.PI/2)/(Math.PI/4))%8)+8)%8;P.rim[i]=Math.min(2,P.rim[i]+1)}}
else if(tool&&dist<R()-6&&P.tops.length<24)P.tops.push({t:tool,x:p.x,y:p.y,r:Math.random()*360|0})}
else if(st=='slice'&&down&&P.cont&&!P.closed&&dist<130)P.lines=(P.lines+1)%5;
render()}
svg.onpointerdown=e=>{svg.setPointerCapture(e.pointerId);last=pt(e);act(last,0,true)};
svg.onpointermove=e=>{if(!last)return;const p=pt(e),d=Math.hypot(p.x-last.x,p.y-last.y);last=p;act(p,d,false)};
svg.onpointerup=svg.onpointercancel=()=>{last=null;if(P)P.pin=null;render()};
setInterval(()=>{if(P&&P.inOven){P.baked=Math.min(140,P.baked+100/12*mult('oven')*.05);render()}},50);
newOrder();render();
</script></body></html>
