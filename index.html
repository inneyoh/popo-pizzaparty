if(c=='box'&&P.cont=='box'&&!P.closed){P.closed=true;return render()}P.cont=c;P.closed=false;render()}
function doA(a){const[k,v]=a.split(':');
if(k=='shop')return shop(1);if(k=='fridge'){if(P)return toast('You already have dough! Use the bin to start over.');return take()}
if(k=='bin'){if(P&&P.inOven)return toast('Take it out of the oven first!');P=null;tool=null;return render()}
if(k=='oven'){if(!P)return toast('Make a pizza first!');return P.inOven?out():inn()}
if(k=='slicer'){tool=tool=='slice'?null:'slice';return render()}
if(k=='dish'||k=='box')return cont(k);if(k=='bell')return serve();
if(!P||P.inOven)return toast(P?'The pizza is baking!':'Get dough from the fridge first!');
if(!fresh())return toast('Roll the dough out first!');if(P.baked>0)return toast('Already baked!');
if(k=='tub')return pick_(v);if(k=='rim'){tool='rim';return render()}
if(k=='ing'){const i=P.types.indexOf(v);if(i>=0)P.types.splice(i,1);else if(P.types.length>=5)return toast('Max 5 ingredients!');else P.types.push(v);tool=null;render()}}
function serve(){if(!P)return toast('Make a pizza first!');if(!P.cont)return toast('Put it on a dish or box first!');if(P.cont=='box'&&!P.closed)return toast('Close the box first!');
const bad=[];
if(O.crust=='cheesy'?P.rim.some(v=>v<2):P.rim.some(v=>v>0))bad.push('crust');
if(O.sauce=='none'?P.sauce&&P.sauce!='none':(P.sauce!=O.sauce||P.cover<85))bad.push('sauce');
if([...P.types].sort()+''!=[...O.ing].sort()+'')bad.push('toppings');
if(P.baked<88||burnt())bad.push('baking');if((O.go?'box':'dish')!=P.cont)bad.push(O.go?'to-go box':'dish');if(!P.cd.slice(0,O.cuts/2).every(Boolean))bad.push('slices');
if(bad.length){P=null;face('s');return toast('Not quite: '+bad.join(', ')+'. Try again!')}
const sec=(Date.now()-O.t0)/1e3,pay=15+O.ing.length*4+(O.crust=='cheesy'?8:0)+(O.sauce!='none'?3:0)+Math.max(0,20-(sec/6|0));
S.coins+=pay;S.served++;save();P=null;tool=null;newOrder();face('h');toast('Delicious! +'+pay+' 🪙')}
function shop(v){$('#shop').className=v?'show':'';if(v)ups()}
function ups(){$('#ups').innerHTML=Object.keys(UP).map(k=>{const c=40*S[k];return`<div class="row" style="margin-bottom:6px"><div style="flex:1"><b>${UP[k][0]}</b> Lv.${S[k]}<br><small>${UP[k][1]}</small></div><button ${S[k]>=5||S.coins<c?'disabled':''} onclick="buy('${k}')">${S[k]>=5?'MAX':'🪙 '+c}</button></div>`}).join('')}
function buy(k){const c=40*S[k];if(S.coins<c||S[k]>=5)return;S.coins-=c;S[k]++;save();ups();render();face('h')}
const svg=$('#g'),pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return{x:(q.x-OX)/K,y:(q.y-OY)/K}};
function act(p,d,down){if(!P||P.inOven)return;const dist=Math.hypot(p.x-150,p.y-150);
if(!fresh()){P.pin=p;if(dist<150)P.rolled=Math.min(100,P.rolled+d*.1*mult('roll'))}
else if(P.baked==0&&tool&&'tomato,cream,pesto'.includes(tool)){P.pin=p;if(dist<R()){P.sauce=tool;if(down)P.cover=Math.max(P.cover,6);P.cover=Math.min(100,P.cover+d*.14*mult('ladle'))}}
else if(tool=='rim'&&down&&P.baked==0){if(dist>R()*.55){const i=((Math.round((Math.atan2(p.y-150,p.x-150)+Math.PI/2)/(Math.PI/4))%8)+8)%8;P.rim[i]=Math.min(2,P.rim[i]+1)}}
else if(tool=='slice'){if(!P.cont){if(down)toast('Put the pizza on a dish or box first!')}else if(P.closed){if(down)toast('The box is closed!')}else{P.pin=p;const n=O.cuts/2,r=R()+8;for(let k=0;k<n;k++){if(P.cd[k])continue;const a=k*Math.PI/n,dx=Math.cos(a),dy=Math.sin(a),u=p.x-150,v=p.y-150,t=(u*dx+v*dy)/r;if(Math.abs(u*dy-v*dx)<26&&t>-1.1&&t<1.1){P.cb[k][Math.max(0,Math.min(9,Math.floor((t+1)*5)))]=1;if(P.cb[k].filter(Boolean).length>=9){P.cd[k]=true;P.cb[k].fill(1)}}}}}}
svg.onpointerdown=e=>{const a=e.target.closest&&e.target.closest('[data-a]');if(a)return doA(a.dataset.a);svg.setPointerCapture(e.pointerId);last=pt(e);act(last,0,true);render()};
svg.onpointermove=e=>{if(!last)return;const p=pt(e),dx=p.x-last.x,dy=p.y-last.y,d=Math.hypot(dx,dy),n=Math.max(1,Math.ceil(d/8));for(let i=1;i<=n;i++)act({x:last.x+dx*i/n,y:last.y+dy*i/n},d/n,false);last=p;render()};
svg.onpointerup=svg.onpointercancel=()=>{last=null;if(P)P.pin=null;render()};
setInterval(()=>{if(P&&P.inOven){P.baked=Math.min(140,P.baked+100/12*mult('oven')*.05);render()}},50);
addEventListener('keydown',e=>{if(e.key=='p'||e.key=='P'){S.roll=S.ladle=S.oven=5;save();ups();render();toast('Hack: all upgrades maxed! ⚡')}});
bg();newOrder();render();
</script></body></html>
